map $http_accept_language $site_lang {
    default fr;
    ~*^en en;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = / {
        return 302 /$site_lang/;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
